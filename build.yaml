targets:
  $default:
    builders:
      advanced_cli:
        enabled: true

builders:
  advanced_cli:
    import: "package:advanced_cli/builders.dart"
    builder_factories:
      - commandBuilder
    build_extensions:
      .dart:
        - .advanced_cli.g.part
    auto_apply: root_package
    build_to: cache
    applies_builders:
      - source_gen:combining_builder